# Render Blueprint — public demo deployment (two services, free plan).
#   mizan-api : FastAPI backend. Downloads + verifies the official Mushaf 1 dump at build time,
#               calls Gemini (server-side only) and the official Quranpedia API. Dorar stays blocked.
#   mizan-web : static Next.js export; the browser calls mizan-api directly.
# Secrets are never in this file: values marked `sync: false` are entered in the Render dashboard.
services:
  - type: web
    name: mizan-api
    runtime: python
    plan: free
    rootDir: backend
    # The official Mushaf dump is downloaded + verified at BUILD time (kept in the deploy), so a
    # restart or a wake-up from sleep never depends on Quranpedia being reachable.
    buildCommand: pip install . && python -m app.cli.sync_quran_dump
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: production
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_THINKING_LEVEL
        value: low
      - key: GEMINI_API_KEY
        sync: false # backend only — never in the frontend
      - key: CORS_ORIGINS
        sync: false # EXACT origin of mizan-web as Render shows it (https://<host>, no path, no trailing slash)

  - type: web
    name: mizan-web
    runtime: static
    rootDir: frontend
    # NEXT_PUBLIC_API_BASE_URL is baked into the JS at BUILD time. Fail the build (instead of
    # silently shipping http://localhost:8000) unless it is an https URL; print it in the build log.
    buildCommand: >-
      node -e "const u=process.env.NEXT_PUBLIC_API_BASE_URL||'';
      if(!/^https:\/\/[^\s\/]+\/?$/.test(u)){console.error('NEXT_PUBLIC_API_BASE_URL must be https://<mizan-api host>, got '+JSON.stringify(process.env.NEXT_PUBLIC_API_BASE_URL));process.exit(1)}
      console.log('API base URL baked into the build: '+u)"
      && npm ci && MIZAN_STATIC_EXPORT=1 npm run build
    staticPublishPath: out
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false # EXACT URL of mizan-api as Render shows it, e.g. https://mizan-api-xxxx.onrender.com (no secret)
